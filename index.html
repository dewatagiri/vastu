function scanMonth(ym,kind,who){const[y,m]=ym.split('-').map(Number),t=today(),out=[];
 for(let d=1;d<=dim(y,m);d++){if(y===t.y&&m===t.m&&d<t.d)continue;const i=DI(y,m,d);out.push([i,muhurta(i,kind,who)])}return out}
function whoList(ps){return{persons:ps.filter(Boolean).map(p=>({rashi:p.rashi,nak:p.nak,label:p.label}))}}
function finder(key,kind,who,noun){
 const s=ST[key];let r='';
 const modeSeg='<div class="seg"><button class="'+(s.mode==='find'?'on':'')+'" data-act="set" data-p="'+key+'.mode" data-v="find">Find dates in a month</button><button class="'+(s.mode==='check'?'on':'')+'" data-act="set" data-p="'+key+'.mode" data-v="check">Check my date</button></div>';
 if(!s.done)return{modeSeg,res:''};
 if(s.mode==='find'){
  if(!s.month)return{modeSeg,res:'<div class="warn">Pick a month first.</div>'};
  const all=scanMonth(s.month,kind,who);if(!all.length)return{modeSeg,res:'<div class="warn">That month is already over. Pick a later one.</div>'};
  const[y,m]=s.month.split('-').map(Number),ranked=all.slice().sort((a,b)=>b[1].score-a[1].score),best=ranked.filter(x=>x[1].score>=45).slice(0,5).sort((a,b)=>a[0].d-b[0].d);
  const restricted=all.filter(x=>x[1].restricted).length;
  r+='<h2>Best dates in '+MONL[m-1]+' '+y+'</h2>';
  if(restricted>all.length*.6)r+='<div class="warn">Most of this month falls in a period traditionally avoided for '+noun+' ('+esc(all.find(x=>x[1].restricted)[1].cons.filter(c=>/traditionally/.test(c))[0]||'')+'). Consider another month if you can.</div>';
  r+=best.length?best.map(x=>dateCard(x[0],x[1],false)).join(''):'<div class="warn">No strong dates this month. Try the next one.</div>';
  const avoid=all.filter(x=>x[1].score<45).map(x=>x[0].d);
  r+=sec(2,avoid.length?'<p class="muted small">Dates to avoid: '+avoid.join(', ')+' '+MON[m-1]+'.</p>':'');
  r+='<p class="hint">Scores combine tithi, nakshatra, weekday, yoga, karana and traditional restricted periods.'+(who.persons.length?' Moon strength for '+who.persons.map(p=>p.label).join(' and ')+' is included.':' Add birth details below for a personal match.')+'</p>'}
 else{
  if(!s.date)return{modeSeg,res:'<div class="warn">Pick a date first.</div>'};
  const[y,m,d]=s.date.split('-').map(Number),i=DI(y,m,d),rr=muhurta(i,kind,who);
  r+='<h2>Your date</h2>'+dateCard(i,rr,true);
  const alts=[];for(let k=-10;k<=10;k++){if(!k)continue;const x=new Date(Date.UTC(y,m-1,d+k));if(x.getTime()<Date.now()-864e5)continue;const j=DI(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate());alts.push([j,muhurta(j,kind,who)])}
  const bests=alts.sort((a,b)=>b[1].score-a[1].score).slice(0,3).filter(a=>a[1].score>rr.score).sort((a,b)=>a[0].jd-b[0].jd);
  if(bests.length)r+='<h3>Better dates within 10 days</h3>'+bests.map(x=>dateCard(x[0],x[1],false)).join('')}
 return{modeSeg,res:r}}

 npgeo(){if(!navigator.geolocation){toast('Location is not available here. Enter it by hand.');return}navigator.geolocation.getCurrentPosition(p=>{ST.np.lat=p.coords.latitude.toFixed(4);ST.np.lon=p.coords.longitude.toFixed(4);ST.np.tz=String(-new Date().getTimezoneOffset()/60);render(false)},()=>toast('Could not get your location. Enter it by hand.'),{timeout:10000})},
